[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video_automation"
version = "0.1.0"
description = "Pipeline para automatización de videos de matemáticas"
authors = [{name = "JaramiluDev Team"}]
dependencies = [
    "pydantic",
    "PyYAML",
    "moviepy"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
