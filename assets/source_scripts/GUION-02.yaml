scenes:
  - id: escena_01
    title: Escena 1. Comprender qué se va a construir
    narration: '(muestra el cartel). Un alumno me preguntó: «¿Cómo pueden ser iguales
      un medio y dos cuartos?». ¿Por dónde empezamos? (acerca la lupa). Por su duda.
      Mira: las dos representaciones muestran la mitad de la unidad. Podríamos convertir
      esa dificultad en un juego. Y en un buen prompt: las instrucciones que daremos
      a la IA. Primero decidimos qué necesita comprender el grupo; después pedimos
      el programa. Entonces nuestro caso empieza en el aula, no en el código. (observa
      la mesa). ¿Todo esto saldrá del mismo programa? Yo pensaba pedir solamente unas
      fichas. Necesitamos fichas recortables, hojas imprimibles, una guía con respuestas
      y práctica en pantalla. Cada material cumple una función. También pediré variantes
      y archivos que podamos guardar. Las respuestas del profesor irán separadas del
      material del alumnado. (señala la computadora). Y comprobaremos las equivalencias.
      No estamos encargando solo dibujos: estamos definiendo un sistema didáctico
      que podamos utilizar en clase. (lee su nota). «Hazme un juego de fracciones».
      Listo, ya tengo el prompt. (señala las tarjetas). Todavía faltan pistas: ¿para
      quién?, ¿qué aprenderá?, ¿cómo jugará? y ¿qué debe entregar el programa? ¿No
      basta con pedir que sea bonito e innovador? Esas palabras no explican lo que
      necesitas. Cada pregunta resuelve una decisión que no conviene dejar al azar.
      Entendido. Voy a convertir mi idea en instrucciones concretas.'
    dialogue:
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: '(muestra el cartel). Un alumno me preguntó: «¿Cómo pueden ser iguales
          un medio y dos cuartos?». ¿Por dónde empezamos?'
      - character: Detective
        voice_model: DrSimi
        text: '(acerca la lupa). Por su duda. Mira: las dos representaciones muestran
          la mitad de la unidad.'
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: Podríamos convertir esa dificultad en un juego.
      - character: Detective
        voice_model: DrSimi
        text: 'Y en un buen prompt: las instrucciones que daremos a la IA. Primero
          decidimos qué necesita comprender el grupo; después pedimos el programa.'
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: Entonces nuestro caso empieza en el aula, no en el código.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: (observa la mesa). ¿Todo esto saldrá del mismo programa? Yo pensaba
          pedir solamente unas fichas.
      - character: Detective
        voice_model: DrSimi
        text: Necesitamos fichas recortables, hojas imprimibles, una guía con respuestas
          y práctica en pantalla. Cada material cumple una función.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: También pediré variantes y archivos que podamos guardar. Las respuestas
          del profesor irán separadas del material del alumnado.
      - character: Detective
        voice_model: DrSimi
        text: '(señala la computadora). Y comprobaremos las equivalencias. No estamos
          encargando solo dibujos: estamos definiendo un sistema didáctico que podamos
          utilizar en clase.'
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: (lee su nota). «Hazme un juego de fracciones». Listo, ya tengo el prompt.
      - character: Detective
        voice_model: DrSimi
        text: '(señala las tarjetas). Todavía faltan pistas: ¿para quién?, ¿qué aprenderá?,
          ¿cómo jugará? y ¿qué debe entregar el programa?'
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: ¿No basta con pedir que sea bonito e innovador?
      - character: Detective
        voice_model: DrSimi
        text: Esas palabras no explican lo que necesitas. Cada pregunta resuelve una
          decisión que no conviene dejar al azar.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: Entendido. Voy a convertir mi idea en instrucciones concretas.
  - id: escena_02
    title: Escena 2. Definir el aprendizaje antes del programa
    narration: '(presenta su planeación). Antes de escribir, describamos el grupo:
      grado, conocimientos previos y dificultades. No todos necesitan lo mismo. Comenzaré
      así: «Actúa como especialista en didáctica de las matemáticas y desarrollo de
      recursos educativos». Después indicaré a quién va dirigido. (señala el aviso).
      Pero sin nombres ni datos personales del alumnado. Nos interesa el contexto
      de aprendizaje. Completemos los espacios con las características reales del
      grupo. Así el encargo tendrá un destinatario claro. (muestra su tarjeta). Aquí
      están sombreadas dos de cuatro partes iguales. Y aquí, cuatro de ocho. Las unidades
      tienen el mismo tamaño y ambas muestran la mitad. Entonces el objetivo será
      que encuentren las fichas que coinciden. Y que expliquen por qué coinciden.
      No basta con acertar una unión. Escribamos: «Que el alumnado identifique fracciones
      equivalentes y explique por qué representan la misma proporción de una unidad».
      Eso sí podremos observar durante el juego. (examina las divisiones). Cada unidad
      debe dividirse en partes de igual área. La precisión también tiene que aparecer
      en el prompt. El numerador indicará las partes sombreadas y el denominador,
      el total. Trabajaremos con fracciones positivas menores que uno. (señala la
      operación). Para comprobar 2/4 = 4/8, comparo 2 × 8 y 4 × 4: ambos dan dieciséis.
      Pidamos esa comprobación con enteros, sin aproximaciones decimales, además de
      dibujos correctamente divididos.'
    dialogue:
      - character: Ana
        voice_model: PersonajeFemenino
        text: '(presenta su planeación). Antes de escribir, describamos el grupo:
          grado, conocimientos previos y dificultades. No todos necesitan lo mismo.'
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: 'Comenzaré así: «Actúa como especialista en didáctica de las matemáticas
          y desarrollo de recursos educativos». Después indicaré a quién va dirigido.'
      - character: Detective
        voice_model: DrSimi
        text: (señala el aviso). Pero sin nombres ni datos personales del alumnado.
          Nos interesa el contexto de aprendizaje.
