  - id: escena_10
    title: Escena 10. Probar la práctica y obtener los archivos
    narration: (selecciona una ficha). Voy a invertirla, unirla y después deshacer
      la jugada. Comprueba que cada acción haga lo previsto. No estamos probando solo
      que existan los botones. (lee la pista). Esta ayuda propone una unión válida
      ahora, pero no garantiza terminar toda la cadena sin bloqueo. ¿Y contra quién
      se juega en pantalla? La práctica es individual o cooperativa, no contra un
      rival automático. Revisemos también la pista y el reinicio antes de usarla en
      clase. (pulsa el control). Elijo «Imprimir fichas / PDF». ¿Dónde aparece ahora
      el archivo? Primero se abre el diálogo de impresión del navegador. Ahí seleccionamos
      «Guardar como PDF» y guardamos. (separa los materiales). Si imprimimos solo
      las fichas, la guía docente no se incluye. Debemos elegir qué material necesitamos.
      Entonces no buscaré otro botón de exportación directa. Así es. En este programa,
      obtener el PDF pasa por la impresión del navegador. (abre el paquete). El ZIP
      tiene varios archivos. ¿Qué corresponde a cada cosa? «hojas», «fichas_individuales»
      y «guia_docente» reúnen los materiales en PNG y SVG. (señala los archivos de
      apoyo). «juego.json» conserva la configuración e «INSTRUCCIONES.txt» explica
