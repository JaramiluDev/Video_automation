        text: Y antes de colocarla, explica por qué los extremos son equivalentes.
          El prompt debe incluir reparto, turnos y finalización.
      - character: Ana
        voice_model: PersonajeFemenino
        text: Gana quien termina sus fichas; si hay bloqueo y el pozo está vacío,
          quien conserve menos.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: (levanta las fichas). Podríamos asignar un color a cada valor. Encontrar
          las parejas sería muy rápido.
      - character: Detective
        voice_model: DrSimi
        text: Pero podrían seguir el color sin comparar las fracciones. Queremos que
          razonen la equivalencia.
      - character: Ana
        voice_model: PersonajeFemenino
        text: (muestra la versión impresa). Pidamos el mismo color para todas las
          familias y una trama común para imprimir en blanco y negro.
      - character: AgenteCero
