        text: '(señala la unión). No necesariamente. Lo que debe coincidir son los
          extremos de fichas distintas que se tocan: por ejemplo, un medio con dos
          cuartos.'
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: Las otras mitades pueden mostrar valores diferentes. Así continuamos
          la cadena.
      - character: Detective
        voice_model: DrSimi
        text: Exacto. Escribe esa regla en el prompt. Queremos un dominó de equivalencias,
          no solamente tarjetas con parejas de respuestas.
      - character: Ana
        voice_model: PersonajeFemenino
        text: Jugaremos por turnos, de dos a cuatro participantes. Primero repartimos
          y dejamos las restantes en el pozo.
