      - character: Ana
        voice_model: PersonajeFemenino
        text: Y aquí, cuatro de ocho. Las unidades tienen el mismo tamaño y ambas
          muestran la mitad.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: Entonces el objetivo será que encuentren las fichas que coinciden.
      - character: Ana
        voice_model: PersonajeFemenino
        text: Y que expliquen por qué coinciden. No basta con acertar una unión.
      - character: Detective
        voice_model: DrSimi
        text: 'Escribamos: «Que el alumnado identifique fracciones equivalentes y
          explique por qué representan la misma proporción de una unidad». Eso sí
          podremos observar durante el juego.'
      - character: Detective
        voice_model: DrSimi
        text: (examina las divisiones). Cada unidad debe dividirse en partes de igual
          área. La precisión también tiene que aparecer en el prompt.
      - character: Ana
        voice_model: PersonajeFemenino
        text: El numerador indicará las partes sombreadas y el denominador, el total.
          Trabajaremos con fracciones positivas menores que uno.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: '(señala la operación). Para comprobar 2/4 = 4/8, comparo 2 × 8 y 4
          × 4: ambos dan dieciséis.'
      - character: Detective
        voice_model: DrSimi
        text: Pidamos esa comprobación con enteros, sin aproximaciones decimales,
          además de dibujos correctamente divididos.
  - id: escena_03
    title: Escena 3. Explicar qué hace que el juego sea un dominó
    narration: '(acerca dos fichas). ¿Las dos mitades de cada ficha tienen que valer
      lo mismo? (señala la unión). No necesariamente. Lo que debe coincidir son los
      extremos de fichas distintas que se tocan: por ejemplo, un medio con dos cuartos.
      Las otras mitades pueden mostrar valores diferentes. Así continuamos la cadena.
      Exacto. Escribe esa regla en el prompt. Queremos un dominó de equivalencias,
      no solamente tarjetas con parejas de respuestas. Jugaremos por turnos, de dos
      a cuatro participantes. Primero repartimos y dejamos las restantes en el pozo.
      Si no tengo una jugada, tomo del pozo. Si la ficha no sirve, paso. Y antes de
      colocarla, explica por qué los extremos son equivalentes. El prompt debe incluir
      reparto, turnos y finalización. Gana quien termina sus fichas; si hay bloqueo
      y el pozo está vacío, quien conserve menos. (levanta las fichas). Podríamos
      asignar un color a cada valor. Encontrar las parejas sería muy rápido. Pero
      podrían seguir el color sin comparar las fracciones. Queremos que razonen la
      equivalencia. (muestra la versión impresa). Pidamos el mismo color para todas
      las familias y una trama común para imprimir en blanco y negro. Lo escribiré
      como restricción: «No utilices colores diferentes para revelar las equivalencias».
      La respuesta tiene que salir de la comparación, no de una pista de color.'
    dialogue:
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: (acerca dos fichas). ¿Las dos mitades de cada ficha tienen que valer
          lo mismo?
      - character: Detective
