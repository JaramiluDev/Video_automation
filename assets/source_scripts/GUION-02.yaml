      instrucciones; el código es el programa resultante. Para otro material, adaptaremos
      las decisiones al nuevo objetivo. Y lo comprobaremos antes de llevarlo al grupo.
      Esa es la lección del caso: diseña, pide, comprueba y enseña. La próxima idea
