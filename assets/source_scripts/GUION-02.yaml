  - id: escena_06
    title: Escena 6. Especificar cómo deben salir los materiales
    narration: '(muestra la regla). Pidamos fichas de aproximadamente nueve por cuatro
      centímetros. El formato físico también necesita instrucciones. (acerca las tijeras
      al borde). El contorno discontinuo indicará por dónde recortar. (señala el centro).
      ¡Pero esta línea no se corta! Si separo las mitades, desarmo la ficha. Debe
      quedar escrito: contorno para recortar y división central para distinguir las
      mitades. Las dos permanecen unidas. Así sabremos qué pedir y qué revisar en
      la impresión. (presenta la hoja). Dos columnas por cinco filas: hasta diez fichas
      en cada hoja. Y un selector para papel A4 o Carta. Al imprimir, elegiremos el
      tamaño que corresponda. (señala la referencia). Incluyamos esta regla de cinco
      centímetros para comprobar que se conservaron las medidas. Imprimiremos a escala
      cien por ciento, sin encabezados ni pies del navegador. Todo eso debe figurar
      en el encargo. Una hoja bien organizada facilita preparar y recortar el material.
      (muestra su hoja). ¿Es suficiente pedir imágenes de «alta calidad»? (examina
      la ampliación). No. Especifica SVG vectoriales y PNG a trescientos píxeles por
      pulgada, respetando las dimensiones físicas. (organiza la carpeta). Las hojas,
      fichas y guía se reunirán en el ZIP con los archivos de apoyo. ¿Y el PDF también
      va dentro? En este programa lo obtenemos desde el diálogo de impresión. No confundamos
      esa salida con los PNG y SVG del paquete.'
    dialogue:
      - character: Detective
        voice_model: DrSimi
        text: (muestra la regla). Pidamos fichas de aproximadamente nueve por cuatro
          centímetros. El formato físico también necesita instrucciones.
