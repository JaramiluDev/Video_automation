  - id: escena_11
    title: Escena 11. Aprender a corregir el prompt
    narration: '(abre el JSON). Voy a recuperar la configuración que guardamos antes.
      (compara las hojas). Tengo la versión anterior y la recuperada. Revisaré que
      las fichas coincidan. Compara también las opciones y la semilla «AULA-2026».
      Dentro de esta versión del programa deben reproducir el mismo material. ¿Después
      puedo pulsar «Crear otra versión»? Sí, después de comprobar la recuperación.
      Recuperar un juego conocido y generar una variante nueva son pruebas diferentes.
      (muestra el ejemplo hipotético). Supongamos que pedí partes iguales y recibí
      este dibujo. ¿Escribo simplemente «no funciona»? Mejor responde tres preguntas:
      qué hiciste, qué ocurrió y qué debía ocurrir. (prepara la lista). Incluye la
      configuración utilizada para que el problema pueda reproducirse. Diré: «Elegí
      rectángulos; aparecieron divisiones desiguales; necesito que todas representen
      partes de igual área». Ahora el reporte es preciso. Y recordemos: este es un
      ejemplo hipotético, no un fallo comprobado del archivo. (empieza a escribir).
      Voy a pedir la corrección. ¿Cómo evito que desaparezcan las funciones que ya
      sirven? (señala el panel). Pide conservarlas expresamente: interfaz, controles,
      impresión, guía docente y ZIP. Escribiré: «Corrige el problema descrito, conserva
      las funciones existentes, entrega de nuevo el archivo completo y explica qué
      cambió». (revisa las pruebas pendientes). Cuando llegue, repetiremos las comprobaciones
      afectadas y revisaremos que lo demás siga funcionando. Una corrección no termina
      al recibir otra respuesta.'
