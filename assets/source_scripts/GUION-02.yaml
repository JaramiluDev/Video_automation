  - id: escena_08
    title: Escena 8. Integrar y enviar el prompt
    narration: '(reúne las tarjetas). Ya tengo muchas decisiones. ¿Cómo las convierto
      en un solo prompt? Ordénalas por bloques: contexto, objetivo, matemáticas, reglas,
      funciones, materiales y pruebas. (empieza a redactar). Cada bloque responderá
      a una necesidad del aula. Yo los integraré en el documento. Así no perderemos
      los requisitos entre tantas frases. Primero decidimos; después redactamos. El
      prompt completo será el resultado de ese trabajo, no una lista de palabras que
      suenan bien. (mira los recortes). Aquí hay fragmentos de código, pero no sé
      cómo unirlos. (señala el archivo completo). Por eso debemos especificar la entrega:
      un único HTML completo, sin funciones omitidas ni partes pendientes. (muestra
      su lista). También necesitamos saber cómo guardarlo, abrirlo en el navegador
      y comprobarlo. Añadiré: «Entrega el código completo y las instrucciones de uso».
      Eso nos permitirá pasar del texto recibido a un recurso que podamos probar,
      sin tener que reconstruirlo con piezas sueltas. (señala la respuesta). ¡Ya llegó
      el archivo! ¿Lo llevamos a clase? (revisa la lista). Todavía no. Recibir una
      respuesta no equivale a aprobarla. Hay que abrirla y contrastarla con lo que
      pedimos. (mantiene visible la meta). Sin olvidar el objetivo: que el alumnado
      comprenda y explique fracciones equivalentes. Entonces revisaré reglas, funciones
      y materiales antes de aceptarlo. Y las pruebas. Si algo falla, describiremos
      el problema y pediremos el ajuste correspondiente.'
