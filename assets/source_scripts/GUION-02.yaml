  - id: escena_05
    title: Escena 5. Describir el programa que recibirá el profesor
    narration: '(sostiene el archivo). ¿Todo debe quedar dentro de «domino_fracciones.html»?
      Sí. HTML, CSS, JavaScript y los dibujos SVG, integrados en un único archivo
      completo, sin dependencias externas. (señala el navegador). Así podremos abrir
      el programa en el navegador y usarlo sin conexión una vez obtenido. ¿También
      podremos generar el código sin internet? No necesariamente. Una cosa es el servicio
      de IA que lo genera y otra, el funcionamiento del archivo terminado. Dejemos
      clara esa diferencia. (señala la pantalla). Cada sección debe tener una función
      clara. Empecemos por «Crear e imprimir»: ahí prepararemos las fichas. En «Practicar»
      podremos trabajar con el dominó en pantalla. Y en «Guía docente» encontraremos
      las orientaciones y respuestas para preparar la clase. Son tres tareas distintas;
      conviene que se reconozcan enseguida. Pide esas tres secciones y una interfaz
      en español. Organizar el programa también forma parte de redactar el prompt.
      (selecciona una ficha). Quiero invertirla y colocarla en uno de los extremos.
      Invertir significa intercambiar sus mitades, no cambiar numerador por denominador.
      Después podrás unirla a la izquierda o a la derecha. Y si la unión no es válida,
      el programa debe explicar por qué, sin limitarse a rechazarla. Añadiré también
      «Pedir una pista», «Deshacer» y «Reiniciar». Con retroalimentación clara y respetuosa.
      Queremos que cada intento ayude a comprender la equivalencia.'
    dialogue:
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: (sostiene el archivo). ¿Todo debe quedar dentro de «domino_fracciones.html»?
      - character: Detective
        voice_model: DrSimi
        text: Sí. HTML, CSS, JavaScript y los dibujos SVG, integrados en un único
          archivo completo, sin dependencias externas.
      - character: Ana
        voice_model: PersonajeFemenino
        text: (señala el navegador). Así podremos abrir el programa en el navegador
          y usarlo sin conexión una vez obtenido.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: ¿También podremos generar el código sin internet?
      - character: Ana
        voice_model: PersonajeFemenino
        text: No necesariamente. Una cosa es el servicio de IA que lo genera y otra,
          el funcionamiento del archivo terminado. Dejemos clara esa diferencia.
      - character: Detective
        voice_model: DrSimi
        text: '(señala la pantalla). Cada sección debe tener una función clara. Empecemos
          por «Crear e imprimir»: ahí prepararemos las fichas.'
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: En «Practicar» podremos trabajar con el dominó en pantalla.
      - character: Ana
        voice_model: PersonajeFemenino
        text: Y en «Guía docente» encontraremos las orientaciones y respuestas para
          preparar la clase.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: Son tres tareas distintas; conviene que se reconozcan enseguida.
      - character: Detective
        voice_model: DrSimi
        text: Pide esas tres secciones y una interfaz en español. Organizar el programa
          también forma parte de redactar el prompt.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: (selecciona una ficha). Quiero invertirla y colocarla en uno de los
          extremos.
      - character: Detective
        voice_model: DrSimi
        text: Invertir significa intercambiar sus mitades, no cambiar numerador por
          denominador. Después podrás unirla a la izquierda o a la derecha.
      - character: Ana
        voice_model: PersonajeFemenino
        text: Y si la unión no es válida, el programa debe explicar por qué, sin limitarse
