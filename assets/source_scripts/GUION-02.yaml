          no de una pista de color.'
  - id: escena_04
    title: Escena 4. Pedir variantes útiles para distintos grupos
    narration: '(compara las bandejas). ¿Cómo traduzco «fácil, medio y difícil» en
      una instrucción útil? Con cantidades concretas: inicial, quince fichas y cinco
      familias; intermedio, veintiocho y siete; avanzado, cuarenta y cinco y nueve.
      También especificaremos las familias de fracciones. Esas decisiones definen
      los conjuntos que debe producir el programa. ¿Asigno cada nivel a una edad?
      No automáticamente. Estos niveles no son una clasificación por edad validada.
      Elegiremos según lo que necesite trabajar el grupo. (ordena las muestras). Tenemos
      tres posibilidades: solo fracciones, solo imágenes o fracción más imagen. Hay
      que pedirlas expresamente. ¿Y las figuras? ¿Basta con escribir «usa muchas formas»?
      Mejor concreta: rectángulos, círculos o una combinación de ambos. En cualquier
      caso, revisaremos que las particiones sean iguales. Así podremos elegir cómo
      presentar el mismo contenido. Ya veo la diferencia: no pediré «muchas variantes»;
      indicaré cuáles deben aparecer entre las opciones. (muestra la tarjeta). He
      escrito «AULA-2026» como semilla. ¿Servirá para recuperar este juego? Sí, siempre
      que conserves también las mismas opciones en esta versión del programa. La semilla
      no actúa sola. (guarda la configuración). Anotaré nivel, representación, figuras,
      papel y tinta junto a esa semilla. Entonces podremos generar otra vez las mismas
      fichas. Ese es el requisito que debe expresar el prompt: repetir una versión
      de forma reproducible, no confiar en que salga parecida.'
    dialogue:
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: (compara las bandejas). ¿Cómo traduzco «fácil, medio y difícil» en una
          instrucción útil?
      - character: Detective
        voice_model: DrSimi
        text: 'Con cantidades concretas: inicial, quince fichas y cinco familias;
          intermedio, veintiocho y siete; avanzado, cuarenta y cinco y nueve.'
      - character: Ana
        voice_model: PersonajeFemenino
        text: También especificaremos las familias de fracciones. Esas decisiones
          definen los conjuntos que debe producir el programa.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: ¿Asigno cada nivel a una edad?
      - character: Ana
        voice_model: PersonajeFemenino
        text: No automáticamente. Estos niveles no son una clasificación por edad
          validada. Elegiremos según lo que necesite trabajar el grupo.
      - character: Ana
        voice_model: PersonajeFemenino
        text: '(ordena las muestras). Tenemos tres posibilidades: solo fracciones,
          solo imágenes o fracción más imagen. Hay que pedirlas expresamente.'
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: ¿Y las figuras? ¿Basta con escribir «usa muchas formas»?
      - character: Detective
        voice_model: DrSimi
        text: 'Mejor concreta: rectángulos, círculos o una combinación de ambos. En
          cualquier caso, revisaremos que las particiones sean iguales.'
      - character: Ana
        voice_model: PersonajeFemenino
        text: Así podremos elegir cómo presentar el mismo contenido.
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: 'Ya veo la diferencia: no pediré «muchas variantes»; indicaré cuáles
          deben aparecer entre las opciones.'
      - character: AgenteCero
        voice_model: PersonajeVaronil2
        text: (muestra la tarjeta). He escrito «AULA-2026» como semilla. ¿Servirá
          para recuperar este juego?
      - character: Detective
        voice_model: DrSimi
        text: Sí, siempre que conserves también las mismas opciones en esta versión
          del programa. La semilla no actúa sola.
      - character: Ana
        voice_model: PersonajeFemenino
        text: (guarda la configuración). Anotaré nivel, representación, figuras, papel
