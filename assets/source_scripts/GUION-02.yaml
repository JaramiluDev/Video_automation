  - id: escena_09
    title: Escena 9. Abrir el programa y comprobar resultados básicos
    narration: '(compara los nombres). Estos archivos parecen iguales: «domino_fracciones.html»
      y «domino_fracciones.html.txt». Observa el final. El que necesitamos debe terminar
      en «.html», no en «.txt». (prepara el archivo). Guardaremos el código como texto
      sin formato, no como un documento de un procesador de palabras. Después revisaré
      el nombre completo y lo abriré en el navegador. Ese pequeño detalle importa.
      Antes de buscar un error del programa, asegurémonos de haber guardado correctamente
      el archivo. (señala las opciones). Probemos una configuración concreta: nivel
      intermedio, fracción más imagen y rectángulos. Selecciono A4, color uniforme
      y semilla «AULA-2026». Ahora pulso «Generar juego». Esperamos veintiocho fichas
      de siete familias, distribuidas en tres hojas para imprimir. ¿Con ver la pantalla
      ya damos la prueba por terminada? No. Compara lo obtenido con esas cantidades
      y revisa las fichas. La configuración nos da un resultado esperado contra el
      cual comprobar el programa. (señala la pizarra). Comprobemos dos casos: 2/4
      = 4/8, pero 2/4 no es igual a 2/8. En el segundo caso hay dos partes sombreadas
      en cada dibujo. ¿Por qué no son iguales? Porque cambia el total de partes iguales:
      dos de cuatro es la mitad; dos de ocho, un cuarto. Por eso no basta con que
      las fichas se vean bien. Revisemos la unidad, sus divisiones y la fracción,
      y contrastemos el resultado con la clave docente.'
